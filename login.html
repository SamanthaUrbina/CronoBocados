<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | CronoBocados</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

        <div class="container">

            <a class="navbar-brand fw-semibold" href="index.html">

                CronoBocados

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="index.html">

                            Inicio

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="menu.html">

                            Menú

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="contacto.html">

                            Contacto

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- LOGIN -->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="login-card">

                        <h2>
                            Bienvenido de nuevo
                        </h2>

                        <p class="login-text">

                            Inicia sesión para realizar pedidos,
                            reservaciones y compartir tu experiencia.

                        </p>

                        <form id="loginForm">

                            <div class="mb-4">

                                <label class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email" id="loginCorreo" class="form-control custom-input"
                                    placeholder="correo@ejemplo.com" required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Contraseña
                                </label>

                                <input type="password" id="loginPassword" class="form-control custom-input"
                                    placeholder="Ingresa tu contraseña" required>

                            </div>

                            <button type="submit" class="btn btn-custom w-100">

                                Iniciar sesión

                            </button>

                        </form>

                        <div class="text-center mt-4">

                            <p>
                                ¿No tienes una cuenta?
                            </p>

                            <a href="registro.html" class="register-link">

                                Crear cuenta

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->

    <script src="js/app.js"></script>

</body>

</html>
