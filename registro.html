<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | CronoBocados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

        <div class="container">

            <a class="navbar-brand fw-semibold" href="index.html">

                CronoBocados

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="index.html">

                            Inicio

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link active" href="menu.html">

                            Menú

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="contacto.html">

                            Contacto

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="btn btn-custom ms-3" href="login.html">

                            Iniciar sesión

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- REGISTRO -->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="login-card">

                        <h2>
                            Crear cuenta
                        </h2>

                        <p class="login-text">

                            Regístrate para realizar pedidos,
                            reservaciones y dejar reseñas.

                        </p>

                        <form id="registroForm">

                            <div class="mb-3">

                                <label class="form-label">
                                    Nombre
                                </label>

                                <input type="text" id="registroNombre" class="form-control custom-input" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email" id="registroCorreo" class="form-control custom-input" required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Contraseña
                                </label>

                                <input type="password" id="registroPassword" class="form-control custom-input" required>

                            </div>

                            <button type="submit" class="btn btn-custom w-100">

                                Registrarse

                            </button>

                        </form>

                        <div class="text-center mt-4">

                            <p>
                                ¿Ya tienes cuenta?
                            </p>

                            <a href="login.html" class="register-link">

                                Iniciar sesión

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="js/app.js"></script>

</body>

</html>
