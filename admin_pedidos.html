<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Pedidos | CronoBocados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-semibold" href="admin.html">
            CronoBocados Admin
        </a>
        <a href="admin.html" class="btn btn-outline-light btn-sm">Regresar</a>

    </div>

</nav>

<!-- HEADER -->

<section class="menu-header">

    <div class="container text-center">

        <h1>Gestión de Pedidos</h1>

        <p>Administra el estado de los pedidos de los clientes</p>

    </div>

</section>

<!-- CONTENIDO -->

<section class="menu-section">

    <div class="container">

        <p class="text-muted" id="sinPedidosAdmin">
            No hay pedidos registrados.
        </p>

        <div id="listaPedidosAdmin"></div>

    </div>

</section>

<!-- TEMPLATE -->

<template id="pedidoAdminTemplate">

    <div class="menu-card p-4 mb-3">

        <div class="d-flex justify-content-between align-items-center">

            <h5>Pedido #<span class="pedido-id"></span></h5>

            <select class="form-select w-auto pedido-estado">

                <option value="Pendiente">Pendiente</option>
                <option value="En proceso">En proceso</option>
                <option value="Entregado">Entregado</option>

            </select>

        </div>

        <hr>

        <p><strong>Fecha:</strong> <span class="pedido-fecha"></span></p>

        <p><strong>Total:</strong> $<span class="pedido-total"></span></p>

        <p><strong>Productos:</strong></p>

        <ul class="pedido-productos"></ul>

    </div>

</template>

<script src="js/admin_pedidos.js"></script>

</body>

</html>
