</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

    <div class="container">

        <a class="navbar-brand fw-semibold" href="dashboard.html">
            CronoBocados
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="menu_usuario.html">Menú</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reservaciones.html">Reservaciones</a>

                </li>

                <li class="nav-item">

                </li>

                    <a class="btn btn-outline-light" href="index.html">Cerrar sesión</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- HEADER -->

<section class="menu-header">

    <div class="container text-center">

        <h1>Pedidos</h1>

        <p>Consulta el estado de tus pedidos en CronoBocados.</p>

    </div>

</section>

<!-- CONTENIDO -->

<section class="menu-section">

    <div class="container">

        <!-- CONTENEDOR DE PEDIDOS -->

        <div id="pedidosContainer">

            <!-- SI NO HAY PEDIDOS -->
            <p id="sinPedidos" class="text-muted">
                No tienes pedidos registrados en este momento.
            </p>

            <!-- AQUÍ SE INSERTAN PEDIDOS DESDE BACKEND -->
            <div id="listaPedidos"></div>

        </div>

    </div>

</section>

<!-- TEMPLATE (ESTRUCTURA DE UN PEDIDO) -->

<template id="pedidoTemplate">

    <div class="menu-card p-4 mb-3">

        <div class="d-flex justify-content-between align-items-center">

            <h4>Pedido #<span class="pedido-id"></span></h4>

            <span class="badge bg-warning text-dark pedido-estado"></span>

        </div>

        <hr>

        <p><strong>Fecha:</strong> <span class="pedido-fecha"></span></p>

        <p><strong>Total:</strong> $<span class="pedido-total"></span></p>

        <p><strong>Productos:</strong></p>

        <ul class="pedido-productos"></ul>

    </div>

</template>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/pedidos.js"></script>

</body>

</html>
