<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Reservaciones | CronoBocados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

        <a class="navbar-brand fw-semibold" href="admin.html">
            CronoBocados Admin
        </a>

            <a href="admin.html" class="btn btn-outline-light btn-sm">

                Regresar

            </a>

        </div>

    </nav>

    <!-- HEADER -->

    <section class="menu-header">

        <div class="container text-center">

            <h1>Gestión de Reservaciones</h1>

            <p>Administra solicitudes de reservación</p>

        </div>

    </section>

    <!-- CONTENIDO -->

    <section class="menu-section">

        <div class="container">

            <p class="text-muted" id="sinReservaciones">

                No hay reservaciones registradas.

            </p>

            <div id="listaReservaciones"></div>

        </div>

    </section>

    <!-- TEMPLATE -->

    <template id="reservacionTemplate">

        <div class="menu-card p-4 mb-3">

            <div class="d-flex justify-content-between align-items-center">

                <h5>
                    Reservación #<span class="res-id"></span>
                </h5>

                <span class="badge bg-warning text-dark estado-badge">
                    Pendiente
                </span>

            </div>

            <hr>

            <p>
                <strong>Cliente:</strong>
                <span class="res-cliente"></span>
            </p>

            <p>
                <strong>Fecha:</strong>
                <span class="res-fecha"></span>
            </p>

            <p>
                <strong>Hora:</strong>
                <span class="res-hora"></span>
            </p>

            <p>
                <strong>Personas:</strong>
                <span class="res-personas"></span>
            </p>

            <p>
                <strong>Notas:</strong>
                <span class="res-notas"></span>
            </p>

            <div class="d-flex gap-2 mt-3">

                <button class="btn btn-success btn-aceptar">
                    Aceptar
                </button>

                <button class="btn btn-danger btn-rechazar">
                    Rechazar
                </button>

            </div>

        </div>

    </template>

    <script src="js/admin_reservaciones.js"></script>

</body>

</html>
