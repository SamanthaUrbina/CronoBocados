<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Reseñas | CronoBocados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="admin.html">

            Admin CronoBocados

        </a>

        <a href="admin.html" class="btn btn-outline-light btn-sm">

            Regresar

        </a>

    </div>

</nav>

<!-- HEADER -->

<section class="menu-header">

    <div class="container text-center">

        <h1>Gestión de Reseñas</h1>

        <p>Administra y modera las reseñas de los clientes</p>

    </div>

</section>

<!-- CONTENIDO -->

<section class="menu-section">

    <div class="container">

        <p class="text-muted" id="sinResenasAdmin">

            No hay reseñas registradas.

        </p>

        <div id="listaResenasAdmin"></div>

    </div>

</section>

<!-- TEMPLATE -->

<template id="resenaAdminTemplate">

    <div class="menu-card p-4 mb-3 resena-card">

        <div class="d-flex justify-content-between align-items-center">

            <h5>

                Reseña #<span class="resena-id"></span>

            </h5>

            <span class="badge bg-warning text-dark">

                <span class="resena-rating"></span>

            </span>

        </div>

        <hr>

        <p>

            <strong>Usuario:</strong>

            <span class="resena-usuario"></span>

        </p>

        <p>

            <strong>Comentario:</strong>

        </p>

        <p class="resena-comentario"></p>

        <div class="mt-3">

            <button class="btn btn-danger btn-eliminar">

                Eliminar reseña

            </button>

        </div>

    </div>

</template>

<script src="js/admin_resenas.js"></script>

</body>

</html>
