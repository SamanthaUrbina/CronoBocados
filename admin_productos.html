<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Productos | CronoBocados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-semibold" href="admin.html">
            CronoBocados Admin
        </a>
        <a href="admin.html" class="btn btn-outline-light btn-sm">Regresar</a>

    </div>

</nav>

<!-- HEADER -->

<section class="menu-header">

    <div class="container text-center">

        <h1>Gestión de Productos</h1>

        <p>Administra el menú del restaurante</p>

    </div>

</section>

<!-- CONTENIDO -->

<section class="menu-section">

    <div class="container">

        <div class="row g-4">

            <!-- FORMULARIO -->

            <div class="col-lg-4">

                <div class="menu-card p-4">

                    <h4>Agregar producto</h4>

                    <form id="formProducto">

                        <div class="mb-3">

                            <label class="form-label">Nombre</label>

                            <input type="text" class="form-control" name="nombre" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Descripción</label>

                            <textarea class="form-control" name="descripcion" required></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Precio</label>

                            <input type="number" class="form-control" name="precio" required>

                        </div>

                        <button type="submit" class="btn btn-custom w-100">
                            Guardar producto
                        </button>

                    </form>

                </div>

            </div>

            <!-- LISTA DE PRODUCTOS -->

            <div class="col-lg-8">

                <div class="menu-card p-4">

                    <h4>Productos registrados</h4>

                    <p class="text-muted" id="sinProductos">
                        No hay productos registrados.
                    </p>

                    <div id="listaProductos"></div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- TEMPLATE PRODUCTO -->

<template id="productoTemplate">

    <div class="menu-card p-3 mb-3">

        <div class="d-flex justify-content-between align-items-center">

            <h5 class="producto-nombre"></h5>

            <span class="badge bg-dark producto-precio"></span>

        </div>

        <p class="producto-descripcion"></p>

        <div class="d-flex gap-2">

            <button class="btn btn-sm btn-warning btn-editar">Editar</button>

            <button class="btn btn-sm btn-danger btn-eliminar">Eliminar</button>

        </div>

    </div>

</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/productos.js"></script>
<script src="js/admin_productos.js"></script>
</body>

</html>
