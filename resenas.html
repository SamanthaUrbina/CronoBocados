<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reseñas | CronoBocados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

        <div class="container">

            <a class="navbar-brand fw-semibold" href="dashboard.html">CronoBocados</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu_usuario.html">Menú</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservaciones.html">Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="resenas.html">Reseñas</a></li>

                    <li class="nav-item ms-3">
                        <a class="btn btn-outline-light" href="index.html">Cerrar sesión</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- HEADER -->

    <section class="menu-header">

        <div class="container text-center">

            <h1>Reseñas</h1>

            <p>Comparte tu experiencia en CronoBocados</p>

        </div>

    </section>

    <!-- CONTENIDO -->

    <section class="menu-section">

        <div class="container">

            <div class="row g-4">

                <!-- FORMULARIO -->

                <div class="col-lg-5">

                    <div class="menu-card p-4">

                        <h3>Dejar reseña</h3>

                        <p>Tu opinión ayuda a mejorar la experiencia.</p>

                        <form id="formResena">

                            <div class="mb-3">

                                <label class="form-label">Calificación</label>

                                <select class="form-control" name="rating" required>
                                    <option value="">Selecciona</option>
                                    <option value="1">1 estrella</option>
                                    <option value="2">2 estrellas</option>
                                    <option value="3">3 estrellas</option>
                                    <option value="4">4 estrellas</option>
                                    <option value="5">5 estrellas</option>
                                </select>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Comentario</label>

                                <textarea class="form-control" name="comentario" rows="4" required></textarea>

                            </div>

                            <button class="btn btn-custom w-100">Enviar reseña</button>

                        </form>

                    </div>

                </div>

                <!-- LISTA -->

                <div class="col-lg-7">

                    <div class="menu-card p-4">

                        <h3>Reseñas de clientes</h3>

                        <p>Opiniones de usuarios sobre su experiencia.</p>

                        <hr>

                        <div id="sinResenas" class="text-muted">
                            Aún no hay reseñas disponibles.
                        </div>

                        <div id="listaResenas"></div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- TEMPLATE -->

    <template id="resenaTemplate">

        <div class="menu-card p-3 mb-3">

            <div class="d-flex justify-content-between">

                <strong>Usuario</strong>

                <span class="resena-rating"></span>

            </div>

            <p class="resena-comentario mt-2"></p>

        </div>

    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/resenas.js"></script>

</body>

</html>
